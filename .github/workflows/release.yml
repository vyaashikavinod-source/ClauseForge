name: Release validation
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Candidate tag (vX.Y.Z)"
        required: true
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate tag
        env:
          TAG: ${{ inputs.tag }}
        run: '[[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]'
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt build
      - run: make check
      - run: python -m build
      - run: docker build -t clauseforge:${{ inputs.tag }} .
      - run: python scripts/check_release_readiness.py --json
      # Intentionally no publication or deployment step.
