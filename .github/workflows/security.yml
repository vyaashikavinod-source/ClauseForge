name: Security
on:
  pull_request:
  push:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pip-audit
      - run: python -m pip_audit -r requirements.txt
      - name: Reject tracked sensitive artifacts
        run: |
          bad="$(git ls-files | grep -E '(^|/)(data/(raw|processed)|checkpoints|artifacts|\.venv|hf_home)(/|$)|\.(gguf|safetensors|pt|pth|ckpt)$|(^|/)\.env$' | grep -vE '/\.gitkeep$' || true)"
          test -z "$bad"
