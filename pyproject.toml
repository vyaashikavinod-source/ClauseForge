[build-system]
requires = ["setuptools==75.8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "clauseforge"
version = "0.1.0"
description = "Engineering foundation for a planned contract-clause intelligence system"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { file = "LICENSE" }
authors = [{ name = "ClauseForge contributors" }]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Typing :: Typed",
]
dependencies = [
    "fastapi==0.141.1",
    "peft==0.20.0",
    "PyYAML==6.0.2",
    "torch==2.8.0",
    "transformers==5.16.1",
    "uvicorn==0.52.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
clauseforge = ["cuad_taxonomy.json"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = [
    "numpy",
    "numpy.*",
    "peft",
    "peft.*",
    "sklearn",
    "sklearn.*",
    "torch",
    "torch.*",
    "tokenizers",
    "tokenizers.*",
    "transformers",
    "transformers.*",
    "yaml",
]
follow_imports = "skip"
ignore_missing_imports = true
